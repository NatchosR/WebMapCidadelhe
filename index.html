<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cidadelhe Planting Map</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1d2a1f; }
  #map { position: absolute; inset: 0; }
  #map.mode-drone, #map.mode-dark { background: #1b1f1d; }
  #map.mode-blank { background: #f7f7f2; }
  .legend h4 { margin: 6px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  .legend .n { color: #888; }
  .leaflet-control-layers { font-size: 14px; }
  .bar { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1000; display: flex; gap: 6px; flex-wrap: wrap; }
  .bar button, .bar select, .fab, .legend-btn {
    font: 600 14px system-ui, sans-serif; border: 0; border-radius: 20px; padding: 9px 14px;
    background: rgba(255,255,255,.95); color: #1d2a1f; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .bar button.active { background: #2e7d32; color: #fff; }
  .bar select { padding: 9px 10px; }
  .fab { position: absolute; right: 12px; bottom: 34px; z-index: 1000; width: 56px; height: 56px; border-radius: 50%;
         padding: 0; font-size: 26px; display: grid; place-items: center; }
  .fab.on { background: #1976d2; color: #fff; }
  .gps-info { position: absolute; right: 76px; bottom: 46px; z-index: 1000; background: rgba(0,0,0,.7); color: #fff;
              font-size: 13px; padding: 5px 10px; border-radius: 12px; display: none; }
  .legend-btn { position: absolute; left: 10px; bottom: 34px; z-index: 1000; }
  .legend { position: absolute; left: 10px; bottom: 82px; z-index: 1000; background: rgba(255,255,255,.96);
            border-radius: 10px; padding: 8px 12px; font-size: 13px; max-height: 55vh; overflow: auto;
            box-shadow: 0 1px 6px rgba(0,0,0,.4); display: none; }
  .legend.open { display: block; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; white-space: nowrap; }
  .legend i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #222; flex: none; }
  .legend b { min-width: 42px; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; z-index: 1000; background: rgba(0,0,0,.7);
          color: #fff; font-size: 13px; padding: 5px 12px; border-radius: 12px; pointer-events: none; transition: opacity .3s; }
  .leaflet-popup-content { font-size: 14px; line-height: 1.45; margin: 10px 14px; }
  .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 16px; }
  .labels { pointer-events: none; }
  .leaflet-top.leaflet-right { top: 58px; }
  .hint { white-space: nowrap; }
  .cross svg { transition: transform .2s; }
  #map.z-far .cross svg { transform: scale(.45); }
  #map.z-mid .cross svg { transform: scale(.7); }
  .leaflet-control-attribution { font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<div id="map" class="mode-drone"></div>

<div class="bar">
  <button data-land="all" class="active">All</button>
  <button data-land="alagoa">Alagoa</button>
  <button data-land="carrascal">Carrascal</button>
  <button data-land="lagar">Lagar</button>
  <select id="month" aria-label="Planting month"></select>
</div>

<button class="legend-btn" id="legendBtn">Legend</button>
<div class="legend" id="legend"></div>

<div class="gps-info" id="gpsInfo"></div>
<button class="fab" id="locate" title="Show my position" aria-label="Show my position">&#x2316;</button>
<div class="hint" id="hint">Zoom in to see tree names</div>

<script src="lib/leaflet.js"></script>
<script src="data/trees.js"></script>
<script src="data/rows.js"></script>
<script src="data/existing.js"></script>
<script>
// ---------- settings ----------
const LABEL_MIN_ZOOM = 20;          // tree names appear from this zoom level
const CAT_COLORS = {                 // same colours as the printed plans (by category)
  "Emergente":       "#54b04a",
  "Support":         "#8ffcd1",
  "Support Tag/Euc": "#a6cee3",
  "Amendoa":         "#f6f991",
  "Olives":          "#7dcdb4",
  "Support / Figo":  "#737ec8",
};
const CAT_NAMES = { "Amendoa": "Almonds" };   // display names in the legend
const SHORT = {                      // short label drawn next to each tree
  "Amendoa": "Amend", "Azeitona Cobrançosa": "Az.Cob", "Azeitona Cornicabra": "Az.Corn",
  "Eucalyptus globulus": "Euc", "Figo": "Figo", "Fraxinus angustifolia": "Frax",
  "Pine nut": "Pine", "Pistachio": "Pist", "Poplar": "Poplar", "Quince": "Quince",
  "Tagasaste": "Tag", "Tilia europeia": "Tilia", "Walnut": "Walnut",
};

// ---------- map ----------
const map = L.map("map", { zoomControl: false, maxZoom: 23, preferCanvas: true });
const drone = L.tileLayer("tiles/{z}/{x}/{y}.webp", {
  minZoom: 14, maxNativeZoom: 21, maxZoom: 23, attribution: "Drone orthophoto"
}).addTo(map);
const BASES = { "Drone": drone, "Dark": L.layerGroup(), "Blank": L.layerGroup() };
let mode = "drone";
// existing trees: black & white crosses at 45°, like in QGIS
const crossIcon = L.divIcon({
  className: "cross", iconSize: [16, 16], iconAnchor: [8, 8],
  html: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3L13 13M13 3L3 13" stroke="#000" stroke-width="4.5" stroke-linecap="round"/><path d="M3 3L13 13M13 3L3 13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>'
});
const existingLayer = L.layerGroup((window.EXISTING || []).map(ll =>
  L.marker(ll, { icon: crossIcon, keyboard: false }).bindPopup("<h3>Existing tree</h3>Already on the land, keep it.")));
existingLayer.addTo(map);
L.control.layers(BASES, { "Existing trees": existingLayer }, { position: "topright", collapsed: false }).addTo(map);
map.attributionControl.setPrefix('<a href="mailto:nathan@scave.world">Nathan Rohrbach (nathan@scave.world)</a>');
map.on("baselayerchange", e => setMode(e.name.toLowerCase()));
map.createPane("labelPane").style.zIndex = 450;

const renderer = L.canvas({ padding: 0.3, tolerance: 6 });
let D, markers = [], landBounds = {}, rowLayer;

// ---------- tree labels drawn on one canvas (fast, with collision avoidance) ----------
const LabelLayer = L.Layer.extend({
  onAdd(m) {
    this._c = L.DomUtil.create("canvas", "labels");
    m.getPane("labelPane").appendChild(this._c);
    m.on("moveend zoomend resize", this.redraw, this);
    m.on("zoomstart", () => { this._c.style.display = "none"; });
    this.redraw();
  },
  redraw() {
    const m = map, c = this._c, size = m.getSize(), dpr = window.devicePixelRatio || 1;
    c.style.display = "";
    c.width = size.x * dpr; c.height = size.y * dpr;
    c.style.width = size.x + "px"; c.style.height = size.y + "px";
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size.x, size.y);
    if (!D || m.getZoom() < LABEL_MIN_ZOOM) return;
    const b = m.getBounds().pad(0.05);
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    const placed = [];               // boxes already drawn
    const cell = 40, grid = new Map();
    const hits = (x0, y0, x1, y1) => {
      for (let gx = Math.floor(x0 / cell); gx <= Math.floor(x1 / cell); gx++)
        for (let gy = Math.floor(y0 / cell); gy <= Math.floor(y1 / cell); gy++)
          for (const r of grid.get(gx + "," + gy) || [])
            if (x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1]) return true;
      return false;
    };
    const add = (box) => {
      for (let gx = Math.floor(box[0] / cell); gx <= Math.floor(box[2] / cell); gx++)
        for (let gy = Math.floor(box[1] / cell); gy <= Math.floor(box[3] / cell); gy++) {
          const k = gx + "," + gy; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(box);
        }
    };
    for (const mk of markers) {
      if (!mk._visible) continue;
      const ll = mk.getLatLng();
      if (!b.contains(ll)) continue;
      const p = m.latLngToContainerPoint(ll);
      const txt = mk._short, w = ctx.measureText(txt).width, r = mk.getRadius();
      // try right, left, above, below the dot
      const opts = [[p.x + r + 3, p.y], [p.x - r - 3 - w, p.y], [p.x - w / 2, p.y - r - 9], [p.x - w / 2, p.y + r + 9]];
      for (const [x, y] of opts) {
        const box = [x - 2, y - 8, x + w + 2, y + 8];
        if (hits(...box)) continue;
        add(box);
        const light = mode === "blank";
        ctx.strokeStyle = light ? "rgba(255,255,255,.95)" : "rgba(0,0,0,.85)"; ctx.lineWidth = 3; ctx.strokeText(txt, x, y);
        ctx.fillStyle = light ? "#1d2a1f" : "#fff"; ctx.fillText(txt, x, y);
        break;
      }
    }
  }
});
const labels = new LabelLayer();

// dot size follows zoom: ~20 cm on the ground, between 2 and 8 px
function radiusFor(z) {
  const mpp = 156543.03 * Math.cos(40.917 * Math.PI / 180) / Math.pow(2, z);
  return Math.max(2, Math.min(8, 0.2 / mpp));
}

// ---------- data ----------
// data comes from data/trees.js and data/rows.js (plain script files, so the page also works when opened from disk)
(function init(trees, rows) {
  if (!trees || !rows) { alert("Tree data missing: check the data/ folder next to index.html"); return; }
  D = trees;
  map.fitBounds(L.latLngBounds(D.trees.map(t => [t[0], t[1]])), { padding: [20, 20] });
  rowLayer = L.geoJSON(rows, { interactive: false, style: rowStyle() }).addTo(map);

  const z0 = map.getZoom(), all = [];
  for (const t of D.trees) {
    const [lat, lng, sp, cat, land, row, dist, month, spacing] = t;
    const name = D.species[sp], col = CAT_COLORS[D.categories[cat]] || "#fff", short = SHORT[name] || name;
    const mk = L.circleMarker([lat, lng], {
      renderer, radius: radiusFor(z0), color: "#111", weight: weightFor(radiusFor(z0)), fillColor: col, fillOpacity: 1
    }).bindPopup(
      `<h3>${name}</h3>` +
      `Tree spacing: <b>${spacing} m</b><br>` +
      `Group: ${D.categories[cat]}<br>` +
      `Plant in: ${D.months[month]}<br>` +
      `<span style="color:#666">Plot: ${cap(D.lands[land])}</span>`
    );
    mk._short = short; mk._land = D.lands[land]; mk._month = D.months[month]; mk._visible = true;
    markers.push(mk); mk.addTo(map);
    (landBounds[mk._land] ||= L.latLngBounds([lat, lng], [lat, lng])).extend([lat, lng]);
    all.push([lat, lng]);
  }
  landBounds.all = L.latLngBounds(all);
  labels.addTo(map);
  buildLegend(); buildMonthFilter(); updateHint(); crossScale();
})(window.TREES, window.ROWS);

// ---------- background modes ----------
function weightFor(r) { return r >= 4 ? 1 : (mode === "blank" ? 0.6 : 0); }
function rowStyle() {
  return mode === "blank" ? { color: "#8d5a99", weight: 1, opacity: 0.7 }
       : mode === "dark"  ? { color: "#b58cc4", weight: 1, opacity: 0.6 }
       :                    { color: "#e1bee7", weight: 1, opacity: 0.6 };
}
function setMode(m) {
  mode = m;
  const el = document.getElementById("map");
  el.classList.remove("mode-drone", "mode-dark", "mode-blank"); el.classList.add("mode-" + m);
  if (rowLayer) rowLayer.setStyle(rowStyle());
  const w = weightFor(radiusFor(map.getZoom()));
  for (const mk of markers) if (mk.options.weight !== w) mk.setStyle({ weight: w });
  if (labels._c) labels.redraw();
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

map.on("zoomend", () => {
  const r = radiusFor(map.getZoom()), w = weightFor(r);
  for (const mk of markers) { mk.setRadius(r); if (mk.options.weight !== w) mk.setStyle({ weight: w }); }
  updateHint();
});
function crossScale() {
  const z = map.getZoom(), el = document.getElementById("map");
  el.classList.toggle("z-far", z < 18); el.classList.toggle("z-mid", z === 18);
}
map.on("zoomend", crossScale);
function updateHint() {
  document.getElementById("hint").style.opacity = map.getZoom() < LABEL_MIN_ZOOM ? 1 : 0;
}

// ---------- plot buttons ----------
document.querySelectorAll(".bar button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll(".bar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const bb = landBounds[btn.dataset.land];
  if (bb) map.fitBounds(bb, { padding: [30, 30] });
});

// ---------- planting-month filter ----------
function buildMonthFilter() {
  const sel = document.getElementById("month");
  sel.innerHTML = `<option value="">All months</option>` + D.months.map(m => `<option>${m}</option>`).join("");
  sel.onchange = () => {
    for (const mk of markers) {
      const show = !sel.value || mk._month === sel.value;
      if (show !== mk._visible) { mk._visible = show; show ? mk.addTo(map) : mk.remove(); }
    }
    labels.redraw();
  };
}

// ---------- legend ----------
function buildLegend() {
  const cc = {}, sc = {};
  for (const t of D.trees) { cc[t[3]] = (cc[t[3]] || 0) + 1; sc[t[2]] = (sc[t[2]] || 0) + 1; }
  const cats = Object.keys(CAT_COLORS).filter(c => D.categories.includes(c));
  const crossSvg = crossIcon.options.html.replace('width="16" height="16"', 'width="14" height="14"');
  document.getElementById("legend").innerHTML =
    `<h4>Groups</h4>` + cats.map(c =>
      `<div><i style="background:${CAT_COLORS[c]}"></i>${CAT_NAMES[c] || c} <span class="n">(${cc[D.categories.indexOf(c)]})</span></div>`).join("") +
    `<div>${crossSvg}Existing tree (keep)</div>` +
    `<h4>Tree names on the map</h4>` + D.species.map((name, i) =>
      `<div><b>${SHORT[name] || name}</b>${name} <span class="n">(${sc[i]})</span></div>`).join("");
}
document.getElementById("legendBtn").onclick = () => document.getElementById("legend").classList.toggle("open");

// ---------- GPS: "where am I" ----------
let watchId = null, meDot = null, meAcc = null, firstFix = false;
const info = document.getElementById("gpsInfo"), locBtn = document.getElementById("locate");
locBtn.onclick = () => {
  if (watchId !== null) {                               // second tap: re-centre on me
    if (meDot) map.setView(meDot.getLatLng(), Math.max(map.getZoom(), 20));
    return;
  }
  if (!navigator.geolocation) { alert("This phone/browser cannot share its location."); return; }
  locBtn.classList.add("on"); info.style.display = "block"; info.textContent = "Finding you…";
  firstFix = false;
  watchId = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude], acc = pos.coords.accuracy;
    if (!meDot) {
      meAcc = L.circle(ll, { radius: acc, color: "#1976d2", weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
      meDot = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1976d2", fillOpacity: 1, interactive: false }).addTo(map);
    } else { meDot.setLatLng(ll); meAcc.setLatLng(ll).setRadius(acc); }
    info.textContent = `You are here (± ${Math.round(acc)} m)`;
    if (!firstFix) { firstFix = true; map.setView(ll, Math.max(map.getZoom(), 20)); }
  }, err => {
    info.textContent = err.code === 1 ? "Location permission refused" : "Location not available";
    locBtn.classList.remove("on");
    navigator.geolocation.clearWatch(watchId); watchId = null;
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
};
</script>
</body>
</html>
